config_version = 13

[bar.default]
auto_hide = true
end = [
    "media",
    "wallpaper",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
layer = "overlay"
position = "bottom"
reserve_space = false
start = [ "group:g1", "workspaces" ]

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 6.0

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 210.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1200.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 180.0

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1317.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 823.0
    cy = 906.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[plugins]
enabled = []

[shell]
offline_mode = true

    [shell.panel]
    transparency_mode = "soft"

[theme]
builtin = "Kanagawa"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/nullcopy/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/nullcopy/Pictures/Wallpapers/tokyo-alley-at-night.jpg"

    [wallpaper.last]
    path = "/home/nullcopy/Pictures/Wallpapers/tokyo-alley-at-night.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/nullcopy/Pictures/Wallpapers/tokyo-alley-at-night.jpg"

    [[wallpaper.favorite]]
    builtin_palette = "Kanagawa"
    palette_source = "builtin"
    path = "/home/nullcopy/Pictures/Wallpapers/liquidmetal.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    builtin_palette = "Kanagawa"
    palette_source = "builtin"
    path = "/home/nullcopy/Pictures/Wallpapers/mountains-at-night.jpg"
    theme_mode = "dark"

[weather]
enabled = false